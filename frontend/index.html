<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Money Base</title>

<!-- iOS PWA meta -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Money Base" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#F4F3F0" />
<meta name="format-detection" content="telephone=no" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="manifest" href="manifest.json" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <!-- Network status bar -->
  <div id="network-banner" class="network-banner hidden">Đang ngoại tuyến — giao dịch sẽ tự đồng bộ khi có mạng</div>

  <!-- HEADER -->
  <header class="top-header">
    <button id="nav-history" class="icon-btn" aria-label="Lich su">☰</button>
    <div class="header-title">Money Base</div>
    <div id="sync-indicator" class="sync-indicator" title="Trang thai dong bo"></div>
  </header>

  <!-- ENTRY VIEW -->
  <section id="view-entry" class="view active">

    <div class="amount-block">
      <div class="amount-toggle">
        <button class="toggle-btn active" data-type="expense">Chi tiền</button>
        <button class="toggle-btn" data-type="income">Thu nhập</button>
      </div>
      <div class="amount-display">
        <span id="amount-value">0</span>
        <span class="currency">₫</span>
      </div>
    </div>

    <div class="category-section">
      <div class="section-label">Danh mục</div>
      <div id="category-grid" class="category-grid"></div>
    </div>

    <div class="field-row">
      <label class="field-label" for="note-input">Ghi chú</label>
      <input id="note-input" class="field-input" type="text" placeholder="Thêm ghi chú..." />
    </div>

    <div class="field-row">
      <label class="field-label" for="date-input">Ngày</label>
      <input id="date-input" class="field-input" type="date" />
    </div>

    <button id="save-btn" class="save-btn">Lưu giao dịch</button>
  </section>

  <!-- HISTORY VIEW -->
  <section id="view-history" class="view">
    <div class="history-header">
      <button id="nav-back" class="icon-btn" aria-label="Quay lai">←</button>
      <div class="header-title">Lịch sử</div>
      <div style="width:32px"></div>
    </div>
    <div id="history-list" class="history-list"></div>
    <div id="history-empty" class="history-empty hidden">Chưa có giao dịch nào</div>
  </section>

  <!-- KEYPAD -->
  <div id="keypad" class="keypad">
    <button class="key" data-key="1">1</button>
    <button class="key" data-key="2">2</button>
    <button class="key" data-key="3">3</button>
    <button class="key" data-key="4">4</button>
    <button class="key" data-key="5">5</button>
    <button class="key" data-key="6">6</button>
    <button class="key" data-key="7">7</button>
    <button class="key" data-key="8">8</button>
    <button class="key" data-key="9">9</button>
    <button class="key" data-key="000">000</button>
    <button class="key" data-key="0">0</button>
    <button class="key key-del" data-key="del">⌫</button>
  </div>

</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
